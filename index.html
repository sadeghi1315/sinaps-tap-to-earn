<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>SINAPS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="stars"></div>
<div class="nebula"></div>


<main class="app">


  <!-- HEADER -->

  <header class="top-header">

    <div class="user-box">

      <div class="user-avatar">
        <span id="userAvatar">S</span>
      </div>

      <div>

        <b id="username">
          SINAPS User
        </b>

        <small>
          SINAPS
        </small>

      </div>

    </div>


    <button
      id="walletTop"
      class="wallet-mini"
      type="button"
      data-page="walletPage"
    >
      Connect
    </button>

  </header>



  <!-- HOME -->

  <section
    id="homePage"
    class="page active"
  >

    <div class="balance-card">

      <div class="balance-label">
        YOUR BALANCE
      </div>


      <!-- مهم: ID با app.js هماهنگ شده -->

      <div
        id="balance"
        class="points"
      >
        0
      </div>


      <div class="snp-label">
        SNP
      </div>


      <div class="level-line">

        LEVEL

        <b id="level">
          1
        </b>

        <span>•</span>

        <b id="energy">
          1000 / 1000
        </b>

        ENERGY

      </div>

    </div>



    <!-- CENTER LOGO -->

    <div
      id="tapArea"
      class="tap-area"
    >

      <div
        id="sLogo"
        class="s-logo"
      >

        <div class="s-core">
          S
        </div>

        <div class="s-ring ring-1"></div>
        <div class="s-ring ring-2"></div>
        <div class="s-ring ring-3"></div>

      </div>


      <div id="floaters"></div>

    </div>



    <!-- ENERGY -->

    <div class="energy-section">

      <div class="energy-info">

        <span>
          ENERGY
        </span>

        <b>
          <span id="energyCurrent">
            1000
          </span>

          /

          <span id="energyMax">
            1000
          </span>

        </b>

      </div>


      <div class="energybar">

        <div id="energyFill"></div>

      </div>

    </div>



    <!-- TAP POWER -->

    <div class="tap-power">

      <span>
        TAP POWER
      </span>

      <b id="tapPower">
        x1
      </b>

    </div>

  </section>



  <!-- BOOST -->

  <section
    id="boostPage"
    class="page"
  >

    <div class="page-title">

      <div class="page-icon">
        ⚡
      </div>

      <div>

        <h2>
          Boost
        </h2>

        <p>
          Increase your earning power
        </p>

      </div>

    </div>


    <div class="boost-card">

      <div class="feature-icon">
        ⚡
      </div>


      <div class="feature-info">

        <b>
          Double Tap
        </b>

        <span>
          Earn 2 SNP for every tap
        </span>

      </div>


      <button
        id="doubleBoost"
        class="action-btn"
        type="button"
      >
        ACTIVATE
      </button>

    </div>


    <div class="boost-card">

      <div class="feature-icon">
        🔋
      </div>


      <div class="feature-info">

        <b>
          Energy Boost
        </b>

        <span>
          Increase maximum energy
        </span>

      </div>


      <button
        id="energyBoost"
        class="action-btn"
        type="button"
      >
        SOON
      </button>

    </div>


    <div class="boost-card">

      <div class="feature-icon">
        🚀
      </div>


      <div class="feature-info">

        <b>
          Turbo
        </b>

        <span>
          Super fast earning
        </span>

      </div>


      <button
        class="action-btn"
        type="button"
        disabled
      >
        SOON
      </button>

    </div>

  </section>



  <!-- DAILY -->

  <section
    id="dailyPage"
    class="page"
  >

    <div class="page-title">

      <div class="page-icon">
        🎁
      </div>

      <div>

        <h2>
          Daily Bonus
        </h2>

        <p>
          Come back
