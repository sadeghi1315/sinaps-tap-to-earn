<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINAPS TEST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #06111b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 20px 15px 100px;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    #balance {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    #energy {
      margin-bottom: 15px;
    }

    #tapArea {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #sLogo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #8ff3ff, #087da8 45%, #031923 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      font-weight: bold;
      color: white;
      box-shadow:
        0 0 25px #00cfff,
        0 0 70px rgba(0,207,255,.45);
      transition: transform .15s ease;
    }

    #floaters {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .floater {
      position: absolute;
      font-size: 25px;
      font-weight: bold;
      color: #6be5ff;
      transform: translate(-50%, -50%);
      animation: floatUp .8s ease forwards;
    }

    @keyframes floatUp {
      from {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -100px);
      }
    }

    .bottom-nav {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 500px;
      height: 65px;
      display: flex;
      background: #0b1d2a;
      border: 1px solid #17465c;
      border-radius: 18px;
      z-index: 9999;
    }

    .nav-item {
      flex: 1;
      border: 0;
      background: transparent;
      color: #7593a0;
      font-size: 12px;
    }

    .nav-item.active {
      color: #6be5ff;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="homePage" class="page active">
    <h1>SINAPS</h1>

    <div id="balance">0</div>

    <div id="energy">1000 / 1000</div>

    <div id="tapArea">
      <div id="sLogo">S</div>
      <div id="floaters"></div>
    </div>

    <div>Tap the SINAPS logo</div>
  </div>

  <div id="boostPage" class="page">
    <h1>⚡ Boost</h1>
    <p>Boost page works.</p>
  </div>

  <div id="dailyPage" class="page">
    <h1>🎁 Daily</h1>
    <p>Daily page works.</p>
  </div>

  <div id="friendsPage" class="page">
    <h1>👥 Friends</h1>
    <p>Friends page works.</p>
  </div>

  <div id="walletPage" class="page">
    <h1>💎 Wallet</h1>
    <p>Wallet page works.</p>
  </div>

</div>

<nav class="bottom-nav">

  <button class="nav-item active" data-page="homePage">
    ⌂<br>Home
  </button>

  <button class="nav-item" data-page="boostPage">
    ⚡<br>Boost
  </button>

  <button class="nav-item" data-page="dailyPage">
    🎁<br>Daily
  </button>

  <button class="nav-item" data-page="friendsPage">
    👥<br>Friends
  </button>

  <button class="nav-item" data-page="walletPage">
    💎<br>Wallet
  </button>

</nav>

<script>
(function () {

  let balance = 0;
  let energy = 1000;
  const maxEnergy = 1000;

  function render() {
    document.getElementById("balance").textContent = balance;
    document.getElementById("energy").textContent =
      energy + " / " + maxEnergy;
  }

  document.getElementById("tapArea").addEventListener("click", function (event) {

    if (energy <= 0) return;

    balance++;
    energy--;

    render();

    const floater = document.createElement("div");

    floater.className = "floater";
    floater.textContent = "+1";

    const rect = document.getElementById("tapArea").getBoundingClientRect();

    floater.style.left =
      (event.clientX - rect.left) + "px";

    floater.style.top =
      (event.clientY - rect.top) + "px";

    document.getElementById("floaters").appendChild(floater);

    const logo = document.getElementById("sLogo");

    logo.style.transform = "scale(0.92)";

    setTimeout(function () {
      logo.style.transform = "scale(1)";
    }, 120);

    setTimeout(function () {
      floater.remove();
    }, 800);

  });

  document.querySelectorAll(".nav-item").forEach(function (button) {

    button.addEventListener("click", function () {

      const pageId = button.getAttribute("data-page");

      document.querySelectorAll(".page").forEach(function (page) {
        page.classList.remove("active");
      });

      document.getElementById(pageId).classList.add("active");

      document.querySelectorAll(".nav-item").forEach(function (item) {
        item.classList.remove("active");
      });

      button.classList.add("active");

    });

  });

  setInterval(function () {

    if (energy < maxEnergy) {
      energy++;
      render();
    }

  }, 3000);

  render();

})();
</script>

</body>
</html>
