  <style>
    html,body {
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#02030d;
      color:white;
      font-family:Arial,sans-serif;
    }

    body {
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .box {
      max-width:420px;
      padding:30px 20px;
    }

    img {
      width:100%;
      border-radius:20px;
      display:block;
      margin-bottom:25px;
    }

    h1 {
      margin:0 0 10px;
      font-size:28px;
    }

    p {
      color:#aeb8d8;
      line-height:1.6;
    }

    .btn {
      display:inline-block;
      margin-top:15px;
      padding:15px 28px;

      background:linear-gradient(90deg,#08a8ff,#704cff);
      color:white;

<body>

  <div class="box">

    <img
      src="https://sadeghi1315.github.io/sinaps-tap-to-earn/assets/sinaps-promo.png"

    <h1>SINAPS COIN</h1>

    <p>
      Tap • Earn • Grow
      <br>
      Join SINAPS and start earning SNP.
    </p>

    <a id="openApp"
       class="btn"
       href="#">
      🚀 Open SINAPS
    </a>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const ref = params.get("ref") || "";

    const botUrl =
      "https://t.me/SNPCOINBot?startapp=" +
      encodeURIComponent(ref);

    document.getElementById("openApp").href = botUrl;

    // Automatically open the Mini App after a short delay
    setTimeout(() => {
      window.location.href = botUrl;
    }, 1800);
  </script>
